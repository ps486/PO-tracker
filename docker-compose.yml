services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: po_tracker
      POSTGRES_PASSWORD: po_tracker
      POSTGRES_DB: po_tracker
    ports:
      - "5432:5432"
    volumes:
      - po_tracker_pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build: .
    command: python -m backend.app.worker.tasks
    env_file: .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  po_tracker_pgdata:
